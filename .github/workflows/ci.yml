# CI de la tienda: en cada push y pull request comprueba que el proyecto sigue sano.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  calidad:
    runs-on: ubuntu-latest
    # Valores FICTICIOS: el build necesita que existan, pero en CI no se conecta a nada real
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      STRIPE_SECRET_KEY: sk_test_ficticia_para_ci
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ficticia_para_ci
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Instalar (y generar el cliente de Prisma)
        run: npm ci
      - name: Linter
        run: npm run lint
      - name: Tipos de TypeScript
        run: npx tsc --noEmit
      - name: Tests
        run: npm test
      - name: Build de produccion
        run: npm run build
